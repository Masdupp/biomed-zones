[project]
name = "biomed-pipeline"
version = "2.0.0"
description = "BioMed Zones data ingestion and H3 aggregation (shared with services/ml)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "h3>=4.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "shapely>=2.0",
  "geopandas>=1.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "xarray>=2024.7",
  "netcdf4>=1.7",
  "scipy>=1.13",
  "requests>=2.32",
  "tenacity>=9.0",
  "copernicusmarine>=2.0",
  "pillow>=10",
]

[project.scripts]
biomed-pipeline = "biomed_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
