[project]
name = "biomed-pipeline"
version = "2.0.0"
description = "BioMed Zones data ingestion and H3 aggregation (shared with services/ml)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "typer>=0.12",
]

[project.scripts]
biomed-pipeline = "biomed_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
