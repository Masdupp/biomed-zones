# Gateway + SPA server (ADR-0010). Runs as non-root on 8080 (nginx-unprivileged image).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS; variables in proxy_pass make nginx resolve upstreams lazily,
  # so the gateway starts even if a backend is restarting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server_tokens off;
  client_max_body_size 5m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/geo+json text/markdown;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # SPA Content-Security-Policy. MapLibre needs blob: workers; species photos come from
  # Wikimedia Commons; framer-motion / MapLibre set inline styles.
  set $csp "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src blob:; img-src 'self' data: blob: https://upload.wikimedia.org https://thumb.wikimedia.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;

  location /api/ {
    set $api_upstream http://api:3001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
  }

  location /ml/ {
    set $ml_upstream http://ml:8001;
    rewrite ^/ml/(.*)$ /$1 break;
    proxy_pass $ml_upstream;
  }

  # Fingerprinted build assets: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Offline vector basemap (GeoJSON): served with its media type so gzip applies.
  location /basemap/ {
    types { application/geo+json geojson; application/json json; }
    expires 7d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /docs/ {
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA fallback; index.html must never be cached so new deploys are picked up.
  location / {
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ /index.html;
  }
}
