# uv workspace root (ADR-0001). Members are installable packages.
[project]
name = "biomed-zones-workspace"
version = "2.0.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["data/pipeline", "services/ml"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]  # scientific variable names (X, X_train)

[tool.pytest.ini_options]
testpaths = ["data/pipeline/tests", "services/ml/tests"]
