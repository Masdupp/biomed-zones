name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        # API integration tests create (and drop) their own database on this server.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: biomed
          POSTGRES_PASSWORD: biomed
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U biomed" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_SERVER: postgresql://biomed:biomed@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-node
          path: reports/junit

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --junitxml=reports/junit/python.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python
          path: reports/junit

  docker:
    name: Compose stack + E2E
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && curl -fsS http://localhost:8080/ml/health && exit 0
            sleep 2
          done
          docker compose ps -a; docker compose logs; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (5 journeys, budgets, axe, offline)
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080
          # No GPU on hosted runners (software WebGL): budgets ×2 here, ×1 locally.
          BUDGET_FACTOR: '2'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            reports/junit
            test-results
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
