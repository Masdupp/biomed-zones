[project]
name = "biomed-ml"
version = "2.0.0"
description = "BioMed Zones suitability model service (expert + SDM + SHAP)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "biomed-pipeline",
  "fastapi>=0.115",
  "joblib>=1.4",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "psycopg[binary]>=3.2",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
biomed-ml = "biomed_ml.cli:app"

[tool.uv.sources]
biomed-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
