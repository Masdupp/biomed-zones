[project]
name = "biomed-ml"
version = "2.0.0"
description = "BioMed Zones suitability model service (expert + SDM + SHAP)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "biomed-pipeline",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
biomed-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
